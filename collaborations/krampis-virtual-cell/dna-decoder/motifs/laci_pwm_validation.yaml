honest_validation_statement:
  non_circular_holdout_equivalent_to_crp: false
  reason: NO — RegulonDB lists only three LacI binding sites, all at lacZp1 / lacZ
    scope (operators O1/O2/O3). There is no independent LacI site pool to train on
    while holding out the natural lac operators. Validation uses leave-one-out among
    operators, known-operator recovery in the lac promoter, specificity on non-lac
    promoters, and the 420 eligible-NOT collapse vs legacy nsites=1 PWM.
  guarantees_achieved:
  - Multi-site PWM (nsites>1) from RegulonDB + curated literature supplements
  - Locked FIMO threshold p<=1e-05 from controls before any re-decode
  - Known-operator recovery panel (lacO1/O2/O3)
  - Leave-one-out recovery among the three RegulonDB operators (within-operon only)
  - 'Specificity scan: 27 non-lac sequences, 0 hits at locked threshold'
  - '420 collapse check at locked threshold: legacy 50 → new 260 eligible LacI NOT
    gates'
  - Consensus palindrome shape check
  guarantees_not_achieved:
  - CRP-style out-of-sample holdout of lac operators while training on independent
    LacI sites
  - Large-scale SELEX/Spec-seq variant training (data not ingested)
  lac_class_ii_implication: Stage 2 integration NOT performed. Replacing the crude
    LacI PWM may change lac dna_topology_class; biologist must re-evaluate after Stage
    2 re-decode.
