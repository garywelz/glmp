holdout_verdict: NO — RegulonDB lists only three LacI binding sites, all at lacZp1
  / lacZ scope (operators O1/O2/O3). There is no independent LacI site pool to train
  on while holding out the natural lac operators. Validation uses leave-one-out among
  operators, known-operator recovery in the lac promoter, specificity on non-lac promoters,
  and the 420 eligible-NOT collapse vs legacy nsites=1 PWM.
validation_approach: specificity_and_known_operator_based_with_loo
