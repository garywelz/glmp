# Custom PWM Registry — GLMP Decoder
# Tracks transcription factors requiring custom PWM files
# (absent from JASPAR CORE 2024 or eukaryote-weighted)
# Updated: July 1, 2026

tfs:
  - name: LacI
    motif_id: LacI_lacO
    organism: ecoli_k12
    jaspar_id: null
    source_paper: "Lewis et al. 1996 Science 271:1247; Gilbert & Maxam 1973 PNAS 70:3581; RegulonDB v14.5"
    consensus: "AATTGTGAGCGGATAACAATT"
    pwm_file: laci_lacO.meme
    status: active
    n_training_sites: 3
    locked_fimo_pvalue_threshold: 1.0e-5
    notes: >
      Stage 2 integrated 2026-07-08. nsites=3 RegulonDB lacO1/O2/O3 PWM; locked p<=1e-5
      from operator-recovery + specificity controls (NOT lac class tuning). Crude nsites=1
      archived as laci_motif_nsites1_legacy.meme. lac Class II PROVISIONAL pending biologist
      sign-off. CRP-vs-LacI validation asymmetry: LacI cannot be hold out non-circularly.
    legacy_pwm_file: laci_motif_nsites1_legacy.meme
    validated_circuits:
      - ecoli_lac_operon

  - name: TrpR
    motif_id: TrpR_trpO
    organism: ecoli_k12
    jaspar_id: null
    source_paper: "Otwinowski et al. 1988 Nature 335:321"
    consensus: "CTAGNNNNCTAN"
    pwm_file: trpr_motif.meme
    status: active
    n_training_sites: 5
    locked_fimo_pvalue_threshold: 0.05
    notes: >
      Split from legacy combined laci_motif.meme (2026-07-08 Stage 2). nsites=5 matrix
      unchanged; uses default custom-PWM confidence p<=0.05 (no stricter lock required).
    legacy_pwm_file: laci_motif_nsites1_legacy.meme
    validated_circuits:
      - ecoli_trp_operon

  - name: AraC
    motif_id: AraC_araI
    organism: ecoli_k12
    jaspar_id: null
    source_paper: "Lobell & Schleif 1990 Science 250:528; Lee et al. 1987 PNAS 84:8814"
    consensus: "TGTGA(N6)TCACA"
    pwm_file: TO_BE_BUILT
    status: pending
    notes: >
      AraC has distinct repressor (araI1-araO2 loop) and activator
      (araI1-araI2) binding modes. A single PWM may not capture both.
      Consider separate repressor and activator PWMs.
    validated_circuits: []

  - name: LexA
    motif_id: LexA_SOS_box
    organism: ecoli_k12
    jaspar_id: null
    source_paper: "Fernandez de Henestrosa et al. 2000 (Mol Microbiol 38:167); Luo et al. 2001 (Nature 408:695)"
    consensus: "CTGT-N8-ACAG (16 bp)"
    pwm_file: lexA_sos.meme
    status: active
    n_training_sites: 21
    notes: >
      SOS box repressor. AT-rich spacer at positions 5-12 is degenerate;
      CTGT and ACAG halves are highly conserved. Separate file from
      laci_motif.meme (LacI/TrpR only).
    validated_circuits:
      - ecoli_sos_lexa
      - ecoli_sos_reca

  - name: CRP
    motif_id: CRP_CAP
    organism: ecoli_k12
    jaspar_id: null
    jaspar_legacy_note: >
      MA2303.1 was historically cited but is Drosophila melanogaster ChIP-seq,
      not E. coli CRP. Decode uses motifs/crp_cap.meme (RegulonDB training set) only.
    source_paper: "RegulonDB v14.5.0 TF-RISet; classical CAP literature (Busby & Ebright)"
    consensus: "TGTGA-N6-TCACA family (22 bp aligned)"
    pwm_file: crp_cap.meme
    status: active
    n_training_sites: 54
    locked_fimo_pvalue_threshold: 0.0001
    notes: >
      Stage 1 PWM built 2026-07-07; Stage 2 integrated 2026-07-08 at locked
      p<=1e-4. Internally validated; biologist sign-off pending
      (see docs/CRP_PWM_BIOLOGIST_REVIEW.md). Training/holdout lists in
      motifs/crp_site_lists.yaml. cAMP effector not modeled (two-layer).
      lac Class II claims are PROVISIONAL pending biologist sign-off.
    validated_circuits: []

  - name: lambda_CI
    motif_id: lambda_CI_OR
    organism: phage_lambda
    jaspar_id: null
    source_paper: "Meyer et al. 1980 J Mol Biol; Ptashne A Genetic Switch"
    consensus: "TACCTCTGGCGGTGATAA"
    pwm_file: lambda_ci_or.meme
    status: pending
    notes: >
      λ CI dimer OR1/OR2 binding; not in JASPAR CORE. Separate matrix from Cro
      (two planned PWMs for lambda switch). ecoli_lambda_switch first run will
      produce INSUFFICIENT_EVIDENCE until lambda_ci_or.meme is built.
    validated_circuits: []

  - name: lambda_Cro
    motif_id: lambda_Cro_OR
    organism: phage_lambda
    jaspar_id: null
    source_paper: "Meyer et al. 1980 J Mol Biol; Ptashne A Genetic Switch"
    consensus: "TATCACCGCCAGAGGTA"
    pwm_file: lambda_cro_or.meme
    status: pending
    notes: >
      λ Cro OR3 preference; not in JASPAR CORE. Separate matrix from CI
      (two planned PWMs for lambda switch). ecoli_lambda_switch first run will
      produce INSUFFICIENT_EVIDENCE until lambda_cro_or.meme is built.
    validated_circuits: []
