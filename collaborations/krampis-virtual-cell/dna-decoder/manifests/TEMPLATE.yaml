# GLMP Decoder Manifest Template
# Copy this file, rename to {circuit_id}.yaml, fill in fields
# Place in queue/pending/ to queue for batch decode

process_id: biology:process:{slug}          # e.g. biology:process:ecoli-flhdc-flagellar
circuit_id: {firestore_doc_id}              # e.g. ecoli_flhdc_flagellar
organism: ecoli_k12                         # ecoli_k12 | phage_lambda | s_cerevisiae | synthetic

# Sequence sourcing
ncbi_accession: NC_000913.3                 # E. coli K-12 MG1655 reference (or J02459.1 for lambda)
genomic_region:
  start: null                               # exact bp start (1-based inclusive)
  end: null                                 # exact bp end (1-based inclusive)
  strand: +                                 # + or -
  tss: null                                 # transcription start (+1) when known
  coordinates_source: ""                    # RegulonDB / primary literature citation
sequence_file: sequences/{circuit_id}.fa   # written after fetch; committed to repo

# Decoder settings
jaspar_db: motifs/JASPAR2024_CORE_non-redundant_pfms_meme.txt
custom_pwm_files: []                        # e.g. [motifs/laci_motif.meme]
pending_custom_pwms: []                     # TFs needing PWM build — expect INSUFFICIENT_EVIDENCE until built
qvalue_threshold: 0.05
repressor_qvalue_threshold: 1.0
max_sites: 50

# Biological class (from glmp-v2 catalog — do not infer from FIMO)
glmp_biological_class: "I"                  # I II III IV V
glmp_biological_subclass: null              # IIIa IVb etc or null
glmp_biological_class_note: ""
glmp_biological_class_source: curated_catalog

# Linking
source_paper_ids: []                        # PMIDs or DOIs — fill from literature
