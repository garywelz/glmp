<!DOCTYPE html>
<html>
<head>
    <title>Simple Base64 Test</title>
</head>
<body>
    <h1>Simple Base64 Image Test</h1>
    
    <!-- Test 1: Simple 1x1 pixel PNG -->
    <h2>Test 1: 1x1 pixel PNG</h2>
    <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==" alt="1x1 pixel" style="border: 1px solid black;">
    
    <!-- Test 2: Simple colored square -->
    <h2>Test 2: Colored square</h2>
    <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8/5+hHgAHggJ/PchI7wAAAABJRU5ErkJggg==" alt="colored square" style="border: 1px solid black;">
    
    <p>If you see two small squares above, base64 works. If not, there's a browser or encoding issue.</p>
</body>
</html>
