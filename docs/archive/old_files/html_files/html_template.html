<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}}</title>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10.6.1/dist/mermaid.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, {{GRADIENT_START}} 0%, {{GRADIENT_END}} 100%);
            min-height: 100vh;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            border-radius: 10px;
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, {{GRADIENT_START}} 0%, {{GRADIENT_END}} 100%);
            color: white;
            padding: 2rem;
            text-align: center;
        }
        .header h1 {
            margin: 0;
            font-size: 2.5rem;
            font-weight: 300;
        }
        .content {
            padding: 2rem;
        }
        .intro {
            background: #f8f9fa;
            padding: 2rem;
            border-radius: 8px;
            margin-bottom: 2rem;
        }
        .toc {
            background: #f8f9fa;
            padding: 2rem;
            border-radius: 8px;
            margin-bottom: 2rem;
        }
        .toc ul {
            list-style: none;
            padding: 0;
        }
        .toc li {
            margin: 0.5rem 0;
        }
        .toc a {
            color: #007bff;
            text-decoration: none;
            font-weight: 500;
        }
        .process-item {
            margin: 2rem 0;
            padding: 1.5rem;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            background: #fafafa;
        }
        .process-item h3 {
            color: #495057;
            margin-bottom: 1rem;
        }
        .mermaid-container {
            background: white;
            padding: 1rem;
            border-radius: 8px;
            margin: 1rem 0;
            overflow-x: auto;
        }
        .footer {
            background: #f8f9fa;
            padding: 2rem;
            text-align: center;
            border-top: 1px solid #dee2e6;
            margin-top: 2rem;
        }
        .highlight {
            background: {{HIGHLIGHT_BG}};
            padding: 1rem;
            border-left: 4px solid {{HIGHLIGHT_BORDER}};
            margin: 1rem 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>{{HEADER_ICON}} {{HEADER_TITLE}}</h1>
            <p>{{HEADER_SUBTITLE}}</p>
        </div>
        <div class="content">
            <div class="intro">
                <h2>{{INTRO_TITLE}}</h2>
                <p>{{INTRO_TEXT}}</p>
                <div class="highlight">
                    <strong>{{HIGHLIGHT_TITLE}}:</strong> {{HIGHLIGHT_TEXT}}
                </div>
            </div>
            
            <div class="toc">
                <h2>{{TOC_TITLE}}</h2>
                <ul>
                    {{TOC_ITEMS}}
                </ul>
            </div>
            
            {{PROCESS_ITEMS}}
            
            <div class="footer">
                <p><strong>Generated using the Programming Framework methodology</strong></p>
                <p>{{FOOTER_TEXT}}</p>
                <p><em>{{FOOTER_QUOTE}}</em></p>
            </div>
        </div>
    </div>
    
    <script>
        mermaid.initialize({
            startOnLoad: true,
            theme: 'default',
            flowchart: {
                useMaxWidth: false,
                htmlLabels: true,
                curve: 'linear',
                nodeSpacing: 30,
                rankSpacing: 40,
                padding: 10
            },
            themeVariables: {
                fontFamily: 'Arial, sans-serif',
                fontSize: '14px',
                primaryColor: '#ff6b6b',
                lineColor: '#333333',
                secondaryColor: '#feca57',
                tertiaryColor: '#4ecdc4'
            }
        });
    </script>
</body>
</html>
